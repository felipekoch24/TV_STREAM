<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV STREAM</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.11/dist/hls.min.js"></script>
    <script src="catalogo.js"></script>
    <style>
        .aviso-proximo {
            position: absolute; bottom: 140px; right: 80px;
            background: rgba(0,0,0,0.85); border: 2px solid #fff;
            padding: 30px 50px; border-radius: 12px; display: none; z-index: 999; text-align: center;
        }
        .aviso-proximo.ativo { display: block; }
        .aviso-proximo h2 { font-size: 36px; color: #fff; margin: 0 0 10px 0; }
        .aviso-proximo p { font-size: 20px; color: #aaa; margin: 0; }

        /* HUD do Player (Escondido por padrão) */
        .hud-player {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            padding: 40px 30px 30px 30px;
            display: flex; flex-direction: column; gap: 15px;
            transform: translateY(100%); transition: transform 0.3s ease;
            z-index: 1000; box-sizing: border-box;
        }
        .hud-player.ativo { transform: translateY(0); }

        .barra-tempo-container {
            width: 100%; background: rgba(255,255,255,0.3); height: 8px; border-radius: 4px; overflow: hidden;
        }
        .barra-tempo-atual {
            width: 0%; height: 100%; background: #f47521;
        }

        .hud-botoes {
            display: flex; justify-content: space-between; align-items: center;
        }
        .hud-info-tempo {
            color: #fff; font-size: 18px; font-weight: bold;
        }
        .btn-sair-player {
            background: rgba(244,117,33,0.9); color: white; border: 2px solid #fff;
            padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer;
        }
        .btn-sair-player:focus, .btn-sair-player:hover {
            background: #fff; color: #000; outline: none; transform: scale(1.05);
        }

        /* Estilo da Tela de Escolha de Perfil / Personagem */
        #tela-perfil {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background-size: cover;
            background-position: center;
        }
        .perfis-container {
            display: flex;
            gap: 40px;
            margin-top: 30px;
        }
        .perfil-card {
            background: rgba(0,0,0,0.6);
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s;
            border: 3px solid transparent;
        }
        .perfil-card:focus, .perfil-card:hover {
            transform: scale(1.1);
            border-color: #f47521;
            outline: none;
        }
        .perfil-card img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            margin-bottom: 15px;
        }
        .perfil-card p {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            margin: 0;
        }
    </style>
</head>
<body>

<!-- TELA DE ESCOLHA DE PERFIL / PERSONAGEM -->
<div id="tela-perfil" class="tela ativa">
    <h2>Quem está assistindo?</h2>
    <div class="perfis-container">
        <div class="perfil-card" tabindex="0" onclick="selecionarPerfil('personagem01', 'fundo01.jpg')">
            <img src="personagem01.jpg" alt="OUTRO">
            <p>OUTRO</p>
        </div>
        <div class="perfil-card" tabindex="0" onclick="selecionarPerfil('personagem02', 'fundo02.jpg')">
            <img src="personagem02.png" alt="FELIPE">
            <p>FELIPE</p>
        </div>
    </div>
</div>

<!-- TELA PRINCIPAL (HOME / SÉRIES) -->
<div id="tela-home" class="tela">
    <h2>📺 TV STREAM</h2>
    <div class="secao" id="secaoContinuar" style="display: none;">
        <h3>⏯️ Continuar Assistindo</h3>
        <div class="grade" id="listaContinuar"></div>
    </div>
    <div class="secao" id="secaoSeries">
        <h3>📚 Minhas Séries</h3>
        <div class="grade" id="listaSeries"></div>
    </div>
    <div class="secao" id="secaoEpisodios" style="display: none;">
        <button class="voltar" id="btnVoltarEp" onclick="voltarParaSeries()">← Voltar</button>
        <h3 id="tituloSerie"></h3>
        <div class="grade" id="listaEpisodios"></div>
    </div>
</div>

<div class="player-container" id="player">
    <video id="video-player" playsinline preload="metadata"></video>
    
    <!-- HUD Profissional (Progresso + Botão Sair) -->
    <div class="hud-player" id="hudPlayer">
        <div class="barra-tempo-container">
            <div class="barra-tempo-atual" id="barraTempoAtual"></div>
        </div>
        <div class="hud-botoes">
            <span class="hud-info-tempo" id="infoTempoTexto">00:00 / 00:00</span>
            <button class="btn-sair-player" id="btnSairPlayer" onclick="fecharPlayer()" tabindex="-1">🚪 SAIR</button>
        </div>
    </div>

    <div class="aviso-proximo" id="avisoProximo">
        <h2 id="textoContagem">Próximo episódio em 10s</h2>
        <p>Pressione [Voltar] para cancelar</p>
    </div>
</div>

<script>
let serieAtual = null, epAtual = null, hls = null, nivel = 'perfil';
let tempoProx = null, intervaloProx = null;
let progresso = JSON.parse(localStorage.getItem('progresso_tv')) || {};
let COLUNAS = 2; // Começa na tela de perfil que tem 2 colunas

function inicializar() {
    // Aplica o fundo salvo se já tiver escolhido antes
    let fundoSalvo = localStorage.getItem('fundo_tv') || 'fundo01.jpg';
    document.getElementById('tela-perfil').style.backgroundImage = `url('${fundoSalvo}')`;

    const div = document.getElementById('listaSeries');
    div.innerHTML = "";
    Object.keys(CATALOGO).forEach(id => {
        let s = CATALOGO[id];
        div.innerHTML += `<div class="item" tabindex="0" onclick="abrirEpisodios('${id}')"><img src="${s.capa}"><p>${s.nome}</p></div>`;
    });
    focarPerfil();
}

function selecionarPerfil(personagem, fundo) {
    localStorage.setItem('fundo_tv', fundo);
    document.body.style.backgroundImage = `url('${fundo}')`;
    
    // Troca de tela
    document.getElementById('tela-perfil').classList.remove('ativa');
    document.getElementById('tela-home').classList.add('ativa');
    
    nivel = 'series';
    COLUNAS = 3; // O catálogo usa 3 colunas na grid
    atualizarContinuar();
    focarSeries();
}

function atualizarContinuar() {
    let secao = document.getElementById('secaoContinuar'), div = document.getElementById('listaContinuar');
    div.innerHTML = ""; let tem = false;
    for (let idEp in progresso) {
        let p = progresso[idEp];
        if (!p || p.porcentagem < 5 || p.porcentagem > 95) continue;
        for (let idS in CATALOGO) {
            let s = CATALOGO[idS], ep = s.eps.find(e => e.id === idEp);
            if (ep) {
                tem = true;
                div.innerHTML += `<div class="item" tabindex="0" onclick="iniciarEp('${idS}','${ep.id}',${p.tempo})"><img src="${s.capa}"><p>${s.nome}<br>${ep.nome}</p><div class="progresso"><div class="barra-progresso" style="width:${p.porcentagem}%"></div></div></div>`;
            }
        }
    }
    secao.style.display = tem ? 'block' : 'none';
}

function abrirEpisodios(id) {
    serieAtual = CATALOGO[id]; nivel = 'episodios';
    document.getElementById('tituloSerie').textContent = serieAtual.nome;
    let div = document.getElementById('listaEpisodios'); div.innerHTML = "";
    serieAtual.eps.forEach((ep, idx) => {
        let pct = progresso[ep.id]?.porcentagem || 0;
        div.innerHTML += `<div class="item" tabindex="0" onclick="reproduzir(${idx})"><img src="${serieAtual.capa}"><p>${ep.nome}</p><div class="progresso"><div class="barra-progresso" style="width:${pct}%"></div></div></div>`;
    });
    document.getElementById('secaoEpisodios').style.display = 'block';
    document.getElementById('secaoSeries').style.display = 'none';
    document.getElementById('secaoContinuar').style.display = 'none';
    document.getElementById('btnVoltarEp').focus();
}

function iniciarEp(idS, idE, tempo) {
    abrirEpisodios(idS);
    let idx = serieAtual.eps.findIndex(e => e.id === idE);
    if(idx >= 0) reproduzir(idx, tempo);
}

function voltarParaSeries() {
    serieAtual = null; nivel = 'series';
    COLUNAS = 3;
    document.getElementById('secaoEpisodios').style.display = 'none';
    document.getElementById('secaoSeries').style.display = 'block';
    atualizarContinuar(); focarSeries();
}

function reproduzir(idx, tempoInicial = null) {
    epAtual = {serie: serieAtual, indice: idx, dados: serieAtual.eps[idx]};
    nivel = 'player';
    let v = document.getElementById('video-player');
    document.getElementById('player').classList.add('ativo');
    document.getElementById('avisoProximo').classList.remove('ativo');
    fecharHud();
    limparPlayer();

    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(epAtual.dados.link);
        hls.attachMedia(v);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            v.currentTime = tempoInicial !== null ? tempoInicial : (progresso[epAtual.dados.id]?.tempo > 5 ? progresso[epAtual.dados.id].tempo : 0);
            v.play().catch(()=>{});
        });
    } else {
        v.src = epAtual.dados.link;
        v.play().catch(()=>{});
    }
    v.ontimeupdate = atualizarProgressoPlayer;
    v.onended = proximoEp;
}

function limparPlayer() {
    if(hls) { hls.destroy(); hls = null; }
    let v = document.getElementById('video-player'); v.pause(); v.removeAttribute('src'); v.load();
    clearTimeout(tempoProx); clearInterval(intervaloProx);
}

function fecharPlayer() {
    limparPlayer();
    document.getElementById('player').classList.remove('ativo');
    document.getElementById('avisoProximo').classList.remove('ativo');
    fecharHud();
    nivel = 'episodios';
    COLUNAS = 3;
    if(serieAtual) abrirEpisodios(Object.keys(CATALOGO).find(k => CATALOGO[k] === serieAtual));
}

function formatarTempo(segundos) {
    let m = Math.floor(segundos / 60), s = Math.floor(segundos % 60);
    return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
}

function atualizarProgressoPlayer() {
    if(!epAtual) return;
    let v = document.getElementById('video-player');
    if(v.duration) {
        let t = v.currentTime, d = v.duration;
        let pct = (t / d) * 100;
        document.getElementById('barraTempoAtual').style.width = `${pct}%`;
        document.getElementById('infoTempoTexto').textContent = `${formatarTempo(t)} / ${formatarTempo(d)}`;
        
        let r = Math.round(t), p = Math.round(pct);
        progresso[epAtual.dados.id] = { tempo: r, porcentagem: p };
        localStorage.setItem('progresso_tv', JSON.stringify(progresso));
    }
}

function pular(seg) {
    let v = document.getElementById('video-player');
    if(v.duration) v.currentTime = Math.min(Math.max(0, v.currentTime + seg), v.duration);
}

function tocarPausar() {
    let v = document.getElementById('video-player');
    v.paused ? v.play() : v.pause();
}

function abrirHud() {
    let hud = document.getElementById('hudPlayer');
    hud.classList.add('ativo');
    document.getElementById('btnSairPlayer').tabIndex = 0;
    document.getElementById('btnSairPlayer').focus();
}

function fecharHud() {
    let hud = document.getElementById('hudPlayer');
    hud.classList.remove('ativo');
    document.getElementById('btnSairPlayer').tabIndex = -1;
}

function proximoEp() {
    let prox = epAtual.indice + 1;
    if(prox >= serieAtual.eps.length) { fecharPlayer(); return; }
    
    let seg = 10;
    document.getElementById('textoContagem').textContent = `Próximo episódio em ${seg}s`;
    document.getElementById('avisoProximo').classList.add('ativo');
    
    intervaloProx = setInterval(() => {
        seg--;
        document.getElementById('textoContagem').textContent = `Próximo episódio em ${seg}s`;
        if(seg <= 0) clearInterval(intervaloProx);
    }, 1000);

    tempoProx = setTimeout(() => {
        document.getElementById('avisoProximo').classList.remove('ativo');
        reproduzir(prox);
    }, 10000);
}

function focarPerfil() {
    setTimeout(() => document.querySelector('#tela-perfil .perfil-card[tabindex="0"]')?.focus(), 100);
}

function focarSeries() {
    setTimeout(() => document.querySelector('#tela-home .item[tabindex="0"]')?.focus(), 100);
}

document.addEventListener('keydown', (e) => {
    let playerAtivo = document.getElementById('player').classList.contains('ativo');
    let avisoAtivo = document.getElementById('avisoProximo').classList.contains('ativo');
    let hudAtivo = document.getElementById('hudPlayer').classList.contains('ativo');

    if(playerAtivo) {
        e.preventDefault();

        if(avisoAtivo) {
            clearTimeout(tempoProx); clearInterval(intervaloProx);
            document.getElementById('avisoProximo').classList.remove('ativo');
            fecharPlayer();
            return;
        }

        switch(e.key) {
            case 'ArrowDown':
                abrirHud();
                break;
            case 'ArrowUp':
                if(hudAtivo) fecharHud();
                break;
            case 'ArrowRight':
                if(!hudAtivo) pular(10);
                break;
            case 'ArrowLeft':
                if(!hudAtivo) pular(-10);
                break;
            case 'Enter':
            case ' ':
            case 'MediaPlayPause':
                if(hudAtivo && document.activeElement.id === 'btnSairPlayer') {
                    fecharPlayer();
                } else {
                    tocarPausar();
                }
                break;
        }
        return;
    }

    // Seleção de itens baseada no nível atual (perfil, series ou episodios)
    let itens;
    if (nivel === 'perfil') {
        itens = document.querySelectorAll('#tela-perfil .perfil-card[tabindex="0"]');
    } else if (nivel === 'episodios') {
        itens = [document.getElementById('btnVoltarEp'), ...document.querySelectorAll('#listaEpisodios .item')];
    } else {
        itens = document.querySelectorAll('#tela-home .item[tabindex="0"]');
    }

    let atual = Array.from(itens).indexOf(document.activeElement);

    if(e.key === 'ArrowUp') { e.preventDefault(); if(atual - COLUNAS >= 0) itens[atual - COLUNAS].focus(); }
    if(e.key === 'ArrowDown') { e.preventDefault(); if(atual + COLUNAS < itens.length) itens[atual + COLUNAS].focus(); }
    if(e.key === 'ArrowRight') { e.preventDefault(); if(atual + 1 < itens.length) itens[atual + 1].focus(); }
    if(e.key === 'ArrowLeft') { e.preventDefault(); if(atual > 0) itens[atual - 1].focus(); }
    if(e.key === 'Enter') { e.preventDefault(); document.activeElement?.click(); }
});

window.onload = inicializar;
</script>
</body>
</html>
