<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV STREAM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :focus { outline: 3px solid #f47521 !important; outline-offset: 3px !important; border-radius: 8px; }
        body { 
            color: white; font-family: Arial, sans-serif; min-height: 100vh; margin: 0; 
            background: #000; padding: 20px;
        }
        .tela { display: none; width: 100%; min-height: 100vh; }
        .ativa { display: block !important; }
        h2 { font-size: 30px; margin-bottom: 30px; color: #f47521; text-align: center; }
        .voltar { 
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); 
            padding: 12px 20px; font-size: 18px; margin-bottom: 30px; color: white; 
            border-radius: 8px; cursor: pointer;
            width: auto;
        }
        .secao { margin-bottom: 50px; }
        .secao h3 { font-size: 24px; margin-bottom: 20px; color: #f47521; }
        .grade { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 25px; max-width: 100%;
        }
        .item { 
            cursor: pointer; transition: transform 0.2s; border-radius: 8px; overflow: hidden; 
            box-shadow: 0 3px 10px rgba(0,0,0,0.6); position: relative; padding: 4px;
        }
        .item:hover, .item:focus { transform: scale(1.05); box-shadow: 0 0 15px rgba(244,117,33,0.6); }
        .item img { width: 100%; height: 220px; object-fit: cover; display: block; }
        .item p { padding: 12px; text-align: center; background: rgba(0,0,0,0.85); font-size: 16px; }
        .progresso { position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.2); }
        .barra-progresso { height: 100%; background: #f47521; transition: width 0.3s; }
        .player-container { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #000; z-index: 999; display: none; }
        .player-container.ativo { display: block !important; }
        #video-player { width: 100%; height: 100%; background: #000; }
        .aviso-proximo { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: rgba(0,0,0,0.92); padding: 30px 50px; border-radius: 10px; 
            text-align: center; display: none; border: 2px solid #f47521;
            min-width: 300px;
        }
        .aviso-proximo.ativo { display: block !important; }
        .aviso-proximo h4 { font-size: 26px; margin: 0; color: #ffcc00; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.11/dist/hls.min.js"></script>
</head>
<body>

<div id="tela-home" class="tela ativa">
    <h2>📺 TV STREAM</h2>

    <!-- Seção Continuar Assistindo -->
    <div class="secao" id="secaoContinuar" style="display: none;">
        <h3>⏯️ Continuar Assistindo</h3>
        <div class="grade" id="listaContinuar"></div>
    </div>

    <div class="secao" id="secaoSeries">
        <h3>📚 Minhas Séries</h3>
        <div class="grade" id="listaSeries"></div>
    </div>

    <div class="secao" id="secaoEpisodios" style="display: none;">
        <button class="voltar" id="btnVoltarEp" onclick="voltarParaSeries()">← Voltar</button>
        <h3 id="tituloSerie"></h3>
        <div class="grade" id="listaEpisodios"></div>
    </div>
</div>

<div class="player-container" id="player">
    <video id="video-player" playsinline preload="metadata" controls></video>
    <div class="aviso-proximo" id="avisoProximo">
        <h4>Começando próximo episódio…</h4>
    </div>
</div>

<script>
let serieAtual = null;
let epAtual = null;
let temporizadorProximo = null;
let hls = null;
let nivel = 'series'; // series | episodios | player
// Agora salva TEMPO e PORCENTAGEM
let progresso = JSON.parse(localStorage.getItem('progresso_tv')) || {};
const COLUNAS_FIXAS = 3; // Número fixo de colunas

// CATÁLOGO
const CATALOGO = {
    bsd_t3: {
        nome: "Bungou Stray Dogs T3",
        capa: "https://raw.githubusercontent.com/felipekoch24/TV_STREAM/main/capas/bsd_t3.jpg",
        eps: [
            {id: "bsd01", nome: "Episódio 01", link: "https://raw.githubusercontent.com/felipekoch24/TV_STREAM/main/bsd_t3_ep01/index.m3u8"},
            {id: "bsd02", nome: "Episódio 02", link: ""},
            {id: "bsd03", nome: "Episódio 03", link: ""},
            {id: "bsd04", nome: "Episódio 04", link: ""},
            {id: "bsd05", nome: "Episódio 05", link: ""},
            {id: "bsd06", nome: "Episódio 06", link: ""},
            {id: "bsd07", nome: "Episódio 07", link: ""},
            {id: "bsd08", nome: "Episódio 08", link: ""},
            {id: "bsd09", nome: "Episódio 09", link: ""},
            {id: "bsd10", nome: "Episódio 10", link: ""}
        ]
    }
};

// Carregar lista de séries e continuar assistindo
function carregarSeries() {
    nivel = 'series';
    const div = document.getElementById('listaSeries');
    div.innerHTML = "";
    Object.keys(CATALOGO).forEach(id => {
        const s = CATALOGO[id];
        const el = document.createElement('div');
        el.className = 'item';
        el.tabIndex = 0;
        el.innerHTML = `<img src="${s.capa}" alt="${s.nome}"><p>${s.nome}</p>`;
        el.onclick = () => abrirEpisodios(id);
        div.appendChild(el);
    });
    carregarContinuarAssistindo();
    focarPrimeiro();
}

// Carregar seção de continuar assistindo
function carregarContinuarAssistindo() {
    const secao = document.getElementById('secaoContinuar');
    const div = document.getElementById('listaContinuar');
    div.innerHTML = "";
    let temConteudo = false;

    for (const idEp in progresso) {
        const dados = progresso[idEp];
        // Mostra apenas se passou de 5% do vídeo
        if (!dados || !dados.tempo || dados.porcentagem < 5) continue;

        for (const idSerie in CATALOGO) {
            const serie = CATALOGO[idSerie];
            const ep = serie.eps.find(e => e.id === idEp);
            if (ep) {
                temConteudo = true;
                const el = document.createElement('div');
                el.className = 'item';
                el.tabIndex = 0;
                el.innerHTML = `
                    <img src="${serie.capa}" alt="${ep.nome}">
                    <p>${serie.nome}<br>${ep.nome}</p>
                    <div class="progresso"><div class="barra-progresso" style="width:${dados.porcentagem}%"></div></div>
                `;
                // Ao clicar, já vai direto do tempo salvo
                el.onclick = () => reproduzirEpComTempo(idSerie, ep.id, dados.tempo);
                div.appendChild(el);
                break;
            }
        }
    }

    secao.style.display = temConteudo ? 'block' : 'none';
}

// Abrir episódios de uma série
function abrirEpisodios(idSerie) {
    serieAtual = CATALOGO[idSerie];
    nivel = 'episodios';
    document.getElementById('tituloSerie').textContent = serieAtual.nome;
    const div = document.getElementById('listaEpisodios');
    div.innerHTML = "";

    serieAtual.eps.forEach((ep, idx) => {
        const porcentagem = progresso[ep.id]?.porcentagem || 0;
        const el = document.createElement('div');
        el.className = 'item';
        el.tabIndex = 0;
        el.innerHTML = `
            <img src="${serieAtual.capa}" alt="${ep.nome}">
            <p>${ep.nome}</p>
            <div class="progresso"><div class="barra-progresso" style="width:${porcentagem}%"></div></div>
        `;
        el.onclick = () => reproduzirEp(idx);
        div.appendChild(el);
    });

    document.getElementById('secaoEpisodios').style.display = 'block';
    document.getElementById('secaoSeries').style.display = 'none';
    document.getElementById('btnVoltarEp').focus();
}

// Reproduzir episódio direto com tempo salvo
function reproduzirEpComTempo(idSerie, idEp, tempoInicial) {
    abrirEpisodios(idSerie);
    const indice = serieAtual.eps.findIndex(e => e.id === idEp);
    if (indice >= 0) reproduzirEp(indice, tempoInicial);
}

// Voltar para lista de séries
function voltarParaSeries() {
    serieAtual = null;
    nivel = 'series';
    document.getElementById('secaoEpisodios').style.display = 'none';
    document.getElementById('secaoSeries').style.display = 'block';
    carregarContinuarAssistindo();
    focarPrimeiro();
}

// Reproduzir vídeo (agora aceita tempo inicial)
function reproduzirEp(indice, tempoInicial = null) {
    epAtual = {serie: serieAtual, indice: indice, dados: serieAtual.eps[indice]};
    nivel = 'player';

    if(!epAtual.dados.link) { alert("Episódio ainda não adicionado!"); return; }

    const video = document.getElementById('video-player');
    document.getElementById('player').classList.add('ativo');
    document.getElementById('avisoProximo').classList.remove('ativo');
    pararPlayer();

    if (Hls.isSupported()) {
        hls = new Hls({
            enableWorker: true,
            lowLatencyMode: false,
            maxBufferLength: 20,
            maxMaxBufferLength: 30,
            xhrSetup: (xhr) => { xhr.withCredentials = false; }
        });
        hls.loadSource(epAtual.dados.link);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            if (tempoInicial !== null) {
                video.currentTime = tempoInicial;
            } else {
                restaurarProgresso();
            }
            video.play().catch(e => console.log("Reprodução:", e));
        });
        hls.on(Hls.Events.ERROR, (_, err) => {
            if(err.fatal) {
                console.error("Erro HLS:", err);
                hls.destroy();
                alert("Não foi possível carregar o vídeo.");
                fecharPlayer();
            }
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = epAtual.dados.link;
        video.load();
        video.addEventListener('loadedmetadata', () => {
            if (tempoInicial !== null) {
                video.currentTime = tempoInicial;
            } else {
                restaurarProgresso();
            }
        });
        video.play().catch(() => {});
    } else {
        alert("Formato não suportado!");
        fecharPlayer();
    }

    video.ontimeupdate = salvarProgressoAutomatico;
    video.onended = mostrarProximoEp;
}

function pararPlayer() {
    salvarProgresso();
    if(hls) { hls.destroy(); hls = null; }
    const v = document.getElementById('video-player');
    v.pause();
    v.removeAttribute('src');
    v.load();
    if(temporizadorProximo) clearTimeout(temporizadorProximo);
}

function fecharPlayer() {
    pararPlayer();
    document.getElementById('player').classList.remove('ativo');
    nivel = 'episodios';
    document.getElementById('btnVoltarEp').focus();
}

// Salva tempo e porcentagem a cada 2 segundos
function salvarProgressoAutomatico() {
    if(!epAtual) return;
    const v = document.getElementById('video-player');
    if(v.duration && !isNaN(v.duration) && v.duration > 0) {
        const tempoAtual = Math.round(v.currentTime);
        const porcentagem = Math.min(100, Math.max(0, Math.round((v.currentTime / v.duration) * 100)));
        progresso[epAtual.dados.id] = { tempo: tempoAtual, porcentagem: porcentagem };
        localStorage.setItem('progresso_tv', JSON.stringify(progresso));
    }
}

function salvarProgresso() {
    if(!epAtual) return;
    const v = document.getElementById('video-player');
    if(v.duration && !isNaN(v.duration) && v.duration > 0) {
        const tempoAtual = Math.round(v.currentTime);
        const porcentagem = Math.min(100, Math.max(0, Math.round((v.currentTime / v.duration) * 100)));
        progresso[epAtual.dados.id] = { tempo: tempoAtual, porcentagem: porcentagem };
        localStorage.setItem('progresso_tv', JSON.stringify(progresso));
    }
}

function restaurarProgresso() {
    setTimeout(() => {
        const v = document.getElementById('video-player');
        const dados = progresso[epAtual.dados.id];
        if(dados && dados.tempo && dados.tempo > 5) {
            v.currentTime = dados.tempo;
        } else {
            v.currentTime = 0;
        }
    }, 800);
}

function mostrarProximoEp() {
    salvarProgresso();
    if(temporizadorProximo) clearTimeout(temporizadorProximo);
    const prox = epAtual.indice + 1;
    if(prox >= serieAtual.eps.length) {
        document.getElementById('avisoProximo').innerHTML = `<h4>Fim da temporada</h4>`;
        document.getElementById('avisoProximo').classList.add('ativo');
        return;
    }
    document.getElementById('avisoProximo').classList.add('ativo');
    temporizadorProximo = setTimeout(() => {
        document.getElementById('avisoProximo').classList.remove('ativo');
        reproduzirEp(prox);
    }, 3000);
}

function focarPrimeiro() {
    setTimeout(() => {
        const primeiro = document.querySelector('.item[tabindex="0"]');
        if(primeiro) primeiro.focus();
    }, 100);
}

// 🎮 CONTROLES CORRIGIDOS
document.addEventListener('keydown', (e) => {
    const playerAberto = document.getElementById('player').classList.contains('ativo');
    const avisoAberto = document.getElementById('avisoProximo').classList.contains('ativo');

    // Se estiver na mensagem de troca de episódio
    if(avisoAberto) {
        if(e.key === 'Escape' || e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
            clearTimeout(temporizadorProximo);
            fecharPlayer();
        }
        return;
    }

    // Controles dentro do vídeo
    if(playerAberto) {
        const v = document.getElementById('video-player');
        switch(e.key) {
            case 'Escape':
            case 'ArrowLeft':
            case 'ArrowDown':
                e.preventDefault();
                fecharPlayer();
                break;
            case 'ArrowRight':
                e.preventDefault();
                v.currentTime = Math.min(v.duration || 99999, v.currentTime + 10);
                break;
            case 'ArrowUp':
                e.preventDefault();
                v.currentTime = Math.max(0, v.currentTime - 10);
                break;
            case 'Enter':
                e.preventDefault();
                v.paused ? v.play().catch(() => {}) : v.pause();
                break;
        }
        return;
    }

    // Ação de VOLTAR
    if(e.key === 'Escape' || e.key === 'ArrowDown') {
        e.preventDefault();
        if(nivel === 'episodios') voltarParaSeries();
        else if(nivel === 'series') window.close();
        return;
    }

    // Navegação entre itens
    let elementos = [];
    if(nivel === 'episodios') {
        elementos = [document.getElementById('btnVoltarEp'), ...Array.from(document.querySelectorAll('#listaEpisodios .item'))];
    } else {
        elementos = Array.from(document.querySelectorAll('.item[tabindex="0"]'));
    }

    const atual = elementos.indexOf(document.activeElement);
    if(atual === -1) return;

    switch(e.key) {
        case 'ArrowUp':
            e.preventDefault();
            const cima = atual - COLUNAS_FIXAS;
            if(cima >= 0) elementos[cima].focus();
            break;
        case 'ArrowDown':
            e.preventDefault();
            const baixo = atual + COLUNAS_FIXAS;
            if(baixo < elementos.length) elementos[baixo].focus();
            break;
        case 'ArrowRight':
            e.preventDefault();
            if(atual + 1 < elementos.length) elementos[atual + 1].focus();
            break;
        case 'ArrowLeft':
            e.preventDefault();
            if(atual > 0) elementos[atual - 1].focus();
            break;
        case 'Enter':
            e.preventDefault();
            if(document.activeElement.tagName === 'BUTTON') {
                document.activeElement.click();
            } else if(document.activeElement.onclick) {
                document.activeElement.onclick();
            }
            break;
    }
});

window.onload = carregarSeries;
</script>
</body>
</html>
