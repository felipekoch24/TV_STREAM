<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV STREAM - Fire Stick / Android</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :focus { outline: 3px solid #f47521 !important; outline-offset: 3px !important; border-radius: 8px; }
        body { 
            color: white; font-family: 'Segoe UI, Roboto, Arial', sans-serif; min-height: 100vh; margin: 0; 
            overflow-y: auto;
            background: linear-gradient(rgba(0,0,0,0.90), rgba(0,0,0,0.90)), url('https://raw.githubusercontent.com/felipekoch24/TV_STREAM/main/imagens%20perfil/fund01.jpg');
            background-size: cover; background-position: center; background-attachment: fixed; padding: 20px;
        }
        .tela { display: none; width: 100%; min-height: 100vh; }
        .ativa { display: block !important; }
        h2 { font-size: 32px; margin-bottom: 30px; color: #fff; }
        .voltar { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); padding: 12px 22px; font-size: 18px; margin-bottom: 30px; color: white; border-radius: 8px; cursor: pointer; }
        .voltar:hover, .voltar:focus { background: rgba(255,255,255,0.2); }
        .cabecalho { display: flex; align-items: center; justify-content: space-between; padding: 30px 0; border-bottom: 2px solid rgba(255,255,255,0.15); margin-bottom: 50px; flex-wrap: wrap; gap: 25px; }
        .info-usuario { display: flex; align-items: center; gap: 20px; }
        .info-usuario img { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #f47521; object-fit: cover; }
        .info-usuario h2 { font-size: 30px; margin: 0; }
        .secao { margin-bottom: 60px; }
        .secao h3 { font-size: 28px; margin-bottom: 25px; color: #f47521; }
        .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 30px; max-width: 100%; }
        .item { 
            cursor: pointer; transition: transform 0.2s; border-radius: 10px; overflow: hidden; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); position: relative; padding: 5px; 
            outline: none; /* Remove contorno padrão para usar o nosso */
        }
        .item:hover, .item:focus { transform: scale(1.07); box-shadow: 0 0 22px rgba(244,117,33,0.5); }
        .item:active { transform: scale(0.97); }
        .item img { width: 100%; height: 260px; object-fit: cover; display: block; }
        .item p { padding: 15px; text-align: center; background: rgba(0,0,0,0.85); font-size: 18px; }
        .progresso { position: absolute; bottom: 0; left: 0; width: 100%; height: 5px; background: rgba(255,255,255,0.2); }
        .barra-progresso { height: 100%; background: #f47521; transition: width 0.3s; }
        #tela-carregando { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.5s; }
        #tela-carregando.ativa { opacity: 1; pointer-events: auto; }
        #imgCarregando { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #f47521; margin-bottom: 30px; }
        #textoCarregando { font-size: 34px; margin-bottom: 40px; color: #fff; }
        .bolinhas { display: flex; gap: 20px; }
        .bolinha { width: 22px; height: 22px; border-radius: 50%; background: #f47521; animation: pular 1.2s infinite; }
        .bolinha:nth-child(2) { animation-delay: 0.2s; }
        .bolinha:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pular { 0%,100% { transform: translateY(0); opacity: 0.5; } 50% { transform: translateY(-22px); opacity: 1; } }
        .player-container { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #000; z-index: 9998; display: none; flex-direction: column; }
        .player-container.ativo { display: flex !important; }
        #video-player { width: 100%; height: 100%; background: #000; }
        .controles-player { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.9)); padding: 25px; transition: opacity 0.4s; }
        .controles-player.oculto { opacity: 0; pointer-events: none; }
        .info-ep { font-size: 22px; margin-bottom: 15px; }
        .tempo { display: flex; justify-content: space-between; font-size: 18px; margin-bottom: 10px; }
        .barra-tempo { width: 100%; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; }
        .preenchimento { height: 100%; background: #f47521; width: 0%; transition: width 0.2s; }
        .proximo-ep { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 30px 50px; border-radius: 12px; text-align: center; display: none; }
        .proximo-ep.ativo { display: block; }
        .proximo-ep h4 { font-size: 28px; margin-bottom: 20px; }
        .proximo-ep p { font-size: 22px; margin-bottom: 25px; color: #ffcc00; }
        .btn-proximo { padding: 12px 30px; font-size: 20px; background: #f47521; border: none; color: white; border-radius: 8px; cursor: pointer; outline: none; }
        .btn-proximo:focus { box-shadow: 0 0 15px rgba(244,117,33,0.7); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<div id="tela-home" class="tela ativa">
    <div class="cabecalho">
        <div class="info-usuario">
            <img id="imgUsuario" src="https://raw.githubusercontent.com/felipekoch24/TV_STREAM/main/imagens%20perfil/masc02.jpg" alt="Foto de perfil">
            <h2>BEM-VINDO, <span id="nomeUsuario">FELIPE</span></h2>
        </div>
    </div>

    <div class="secao">
        <h3>📺 MINHAS SÉRIES</h3>
        <div class="grade" id="listaSeries"></div>
    </div>

    <div class="secao" id="secaoEpisodios" style="display: none;">
        <button class="voltar" id="btnVoltarEp" onclick="voltarParaSeries()">← Voltar para Séries</button>
        <h3 id="tituloSerie"></h3>
        <div class="grade" id="listaEpisodios"></div>
    </div>
</div>

<div id="tela-carregando" class="tela">
    <img id="imgCarregando" src="https://raw.githubusercontent.com/felipekoch24/TV_STREAM/main/imagens%20perfil/masc02.jpg" alt="Carregando">
    <h2 id="textoCarregando">Carregando...</h2>
    <div class="bolinhas">
        <div class="bolinha"></div><div class="bolinha"></div><div class="bolinha"></div>
    </div>
</div>

<div class="player-container" id="player">
    <video id="video-player" playsinline preload="metadata"></video>
    <div class="controles-player" id="controlesVideo">
        <div class="info-ep" id="infoEpAtual"></div>
        <div class="tempo">
            <span id="tempoAtual">00:00</span>
            <span id="tempoTotal">00:00</span>
        </div>
        <div class="barra-tempo">
            <div class="preenchimento" id="barraTempo"></div>
        </div>
    </div>
    <div class="proximo-ep" id="avisoProximo">
        <h4>Próximo Episódio</h4>
        <p>Continua em <span id="contagemRegressiva">10</span> segundos</p>
        <button class="btn-proximo" onclick="irProximoEp()">Assistir Agora</button>
    </div>
</div>

<script>
let perfilAtual = {
    nome: "FELIPE",
    avatar: "https://raw.githubusercontent.com/felipekoch24/TV_STREAM/main/imagens%20perfil/masc02.jpg",
    progresso: JSON.parse(localStorage.getItem('progresso_felipe')) || {}
};
let serieAtual = null;
let epAtual = null;
let temporizadorProximo = null;
let hls = null;

const CATALOGO = {
    jujutsu: {
        nome: "Jujutsu Kaisen T3",
        capa: "https://raw.githubusercontent.com/felipekoch24/TV_STREAM/main/capas/jujutsu-t3.webp",
        eps: [
            {id: "j3", nome: "Episódio 3", link: "https://cdn.imagesskill.com/stream/j/jujutsu-kaisen-3-dublado/03v2.mp4/index.m3u8"},
            {id: "j4", nome: "Episódio 4", link: "https://cdn.imagesskill.com/stream/j/jujutsu-kaisen-3-dublado/04.mp4/index.m3u8"},
            {id: "j5", nome: "Episódio 5", link: "https://cdn.imagesskill.com/stream/j/jujutsu-kaisen-3-dublado/05.mp4/index.m3u8"},
            {id: "j6", nome: "Episódio 6", link: "https://cdn.imagesskill.com/stream/j/jujutsu-kaisen-3-dublado/06.mp4/index.m3u8"},
            {id: "j7", nome: "Episódio 7", link: "https://cdn.imagesskill.com/stream/j/jujutsu-kaisen-3-dublado/07.mp4/index.m3u8"},
            {id: "j8", nome: "Episódio 8", link: "https://cdn.imagesskill.com/stream/j/jujutsu-kaisen-3-dublado/08.mp4/index.m3u8"},
            {id: "j9", nome: "Episódio 9", link: "https://cdn.imagesskill.com/stream/j/jujutsu-kaisen-3-dublado/09.mp4/index.m3u8"},
            {id: "j10", nome: "Episódio 10", link: "https://cdn.imagesskill.com/stream/j/jujutsu-kaisen-3-dublado/10.mp4/index.m3u8"},
            {id: "j11", nome: "Episódio 11", link: "https://cdn.imagesskill.com/stream/j/jujutsu-kaisen-3-dublado/11.mp4/index.m3u8"},
            {id: "j12", nome: "Episódio 12", link: "https://cdn.imagesskill.com/stream/j/jujutsu-kaisen-3-dublado/12.mp4/index.m3u8"}
        ]
    },
    heroi: {
        nome: "Herói do Escudo T2",
        capa: "https://raw.githubusercontent.com/felipekoch24/TV_STREAM/main/capas/heroidescudot2.jpeg",
        eps: [
            {id: "h3", nome: "Episódio 3", link: "https://cdn.imagesskill.com/stream/t/tate-no-yuusha-no-nariagari-season-2-dublado/03.mp4/index.m3u8"},
            {id: "h4", nome: "Episódio 4", link: "https://cdn.imagesskill.com/stream/t/tate-no-yuusha-no-nariagari-season-2-dublado/04.mp4/index.m3u8"},
            {id: "h5", nome: "Episódio 5", link: "https://cdn.imagesskill.com/stream/t/tate-no-yuusha-no-nariagari-season-2-dublado/05.mp4/index.m3u8"},
            {id: "h6", nome: "Episódio 6", link: "https://cdn.imagesskill.com/stream/t/tate-no-yuusha-no-nariagari-season-2-dublado/06.mp4/index.m3u8"},
            {id: "h7", nome: "Episódio 7", link: "https://cdn.imagesskill.com/stream/t/tate-no-yuusha-no-nariagari-season-2-dublado/07.mp4/index.m3u8"},
            {id: "h8", nome: "Episódio 8", link: "https://cdn.imagesskill.com/stream/t/tate-no-yuusha-no-nariagari-season-2-dublado/08.mp4/index.m3u8"},
            {id: "h9", nome: "Episódio 9", link: "https://cdn.imagesskill.com/stream/t/tate-no-yuusha-no-nariagari-season-2-dublado/09.mp4/index.m3u8"},
            {id: "h10", nome: "Episódio 10", link: "https://cdn.imagesskill.com/stream/t/tate-no-yuusha-no-nariagari-season-2-dublado/10.mp4/index.m3u8"},
            {id: "h11", nome: "Episódio 11", link: "https://cdn.imagesskill.com/stream/t/tate-no-yuusha-no-nariagari-season-2-dublado/11.mp4/index.m3u8"},
            {id: "h12", nome: "Episódio 12", link: "https://cdn.imagesskill.com/stream/t/tate-no-yuusha-no-nariagari-season-2-dublado/12.mp4/index.m3u8"},
            {id: "h13", nome: "Episódio 13", link: "https://cdn.imagesskill.com/stream/t/tate-no-yuusha-no-nariagari-season-2-dublado/13.mp4/index.m3u8"}
        ]
    },
    sfv: {
        nome: "Street Fighter II V",
        capa: "https://raw.githubusercontent.com/felipekoch24/TV_STREAM/main/capas/streetfighterv.jpeg",
        eps: [
            {id: "sf19", nome: "Episódio 19", link: "https://cdn.imagesskill.com/stream/s/street-fighter-2-v-dublado/19.mp4/index.m3u8"},
            {id: "sf20", nome: "Episódio 20", link: "https://cdn.imagesskill.com/stream/s/street-fighter-2-v-dublado/20.mp4/index.m3u8"},
            {id: "sf21", nome: "Episódio 21", link: "https://cdn.imagesskill.com/stream/s/street-fighter-2-v-dublado/21.mp4/index.m3u8"},
            {id: "sf22", nome: "Episódio 22", link: "https://cdn.imagesskill.com/stream/s/street-fighter-2-v-dublado/22.mp4/index.m3u8"},
            {id: "sf23", nome: "Episódio 23", link: "https://cdn.imagesskill.com/stream/s/street-fighter-2-v-dublado/23.mp4/index.m3u8"},
            {id: "sf24", nome: "Episódio 24", link: "https://cdn.imagesskill.com/stream/s/street-fighter-2-v-dublado/24.mp4/index.m3u8"},
            {id: "sf25", nome: "Episódio 25", link: "https://cdn.imagesskill.com/stream/s/street-fighter-2-v-dublado/25.mp4/index.m3u8"},
            {id: "sf26", nome: "Episódio 26", link: "https://cdn.imagesskill.com/stream/s/street-fighter-2-v-dublado/26.mp4/index.m3u8"},
            {id: "sf27", nome: "Episódio 27", link: "https://cdn.imagesskill.com/stream/s/street-fighter-2-v-dublado/27.mp4/index.m3u8"},
            {id: "sf28", nome: "Episódio 28", link: "https://cdn.imagesskill.com/stream/s/street-fighter-2-v-dublado/28.mp4/index.m3u8"},
            {id: "sf29", nome: "Episódio 29", link: "https://cdn.imagesskill.com/stream/s/street-fighter-2-v-dublado/29.mp4/index.m3u8"}
        ]
    }
};

// Carrega lista de séries ao iniciar
function carregarSeries() {
    const div = document.getElementById('listaSeries');
    div.innerHTML = "";
    Object.keys(CATALOGO).forEach(id => {
        const serie = CATALOGO[id];
        const el = document.createElement('div');
        el.className = 'item';
        el.tabIndex = 0;
        el.setAttribute('role', 'button');
        el.setAttribute('aria-label', serie.nome);
        el.innerHTML = `<img src="${serie.capa}" alt="${serie.nome}"><p>${serie.nome}</p>`;
        el.onclick = () => abrirEpisodios(id);
        el.onkeydown = (e) => { if(e.key === 'Enter') abrirEpisodios(id); };
        div.appendChild(el);
    });
    // Foca no primeiro item ao abrir
    setTimeout(() => {
        const primeiro = document.querySelector('#listaSeries .item');
        if(primeiro) primeiro.focus();
    }, 100);
}

function abrirEpisodios(idSerie) {
    serieAtual = CATALOGO[idSerie];
    document.getElementById('tituloSerie').textContent = serieAtual.nome;
    const div = document.getElementById('listaEpisodios');
    div.innerHTML = "";
    serieAtual.eps.forEach((ep, idx) => {
        const prog = perfilAtual.progresso?.[ep.id] || 0;
        const el = document.createElement('div');
        el.className = 'item';
        el.tabIndex = 0;
        el.setAttribute('role', 'button');
        el.setAttribute('aria-label', ep.nome);
        el.innerHTML = `<img src="${serieAtual.capa}" alt="${ep.nome}"><p>${ep.nome}</p><div class="progresso"><div class="barra-progresso" style="width:${prog}%"></div></div>`;
        el.onclick = () => reproduzirEp(idx);
        el.onkeydown = (e) => { if(e.key === 'Enter') reproduzirEp(idx); };
        div.appendChild(el);
    });
    document.getElementById('secaoEpisodios').style.display = 'block';
    document.querySelector('.secao:not(#secaoEpisodios)').style.display = 'none';
    // Foca no botão voltar primeiro
    setTimeout(() => {
        document.getElementById('btnVoltarEp').focus();
    }, 100);
}

function voltarParaSeries() {
    document.getElementById('secaoEpisodios').style.display = 'none';
    document.querySelector('.secao:not(#secaoEpisodios)').style.display = 'block';
    serieAtual = null;
    setTimeout(() => {
        const primeiro = document.querySelector('#listaSeries .item');
        if(primeiro) primeiro.focus();
    }, 100);
}

function reproduzirEp(indice) {
    epAtual = {serie: serieAtual, indice: indice, dados: serieAtual.eps[indice]};
    if(!epAtual.dados.link) return alert("Link indisponível!");
    const video = document.getElementById('video-player');
    document.getElementById('infoEpAtual').textContent = `${serieAtual.nome} - ${epAtual.dados.nome}`;
    document.getElementById('player').classList.add('ativo');
    document.getElementById('avisoProximo').classList.remove('ativo');
    pararPlayer();

    if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true });
        hls.loadSource(epAtual.dados.link);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { restaurarProgresso(); video.play().catch(() => {}); });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = epAtual.dados.link;
        video.addEventListener('loadedmetadata', () => { restaurarProgresso(); video.play().catch(() => {}); });
    } else { alert("Formato não suportado!"); }

    video.onended = mostrarProximoEp;
}

function pararPlayer() {
    if (hls) hls.destroy(); hls = null;
    const v = document.getElementById('video-player'); v.pause(); v.src = ""; v.load();
    if(temporizadorProximo) clearInterval(temporizadorProximo);
}

function salvarProgresso() {
    if(!epAtual) return;
    const v = document.getElementById('video-player');
    if(!perfilAtual.progresso) perfilAtual.progresso = {};
    if(v.duration && !isNaN(v.duration)) {
        const tempo = Math.round(v.currentTime);
        const porcentagem = Math.min(100, (tempo / v.duration) * 100);
        perfilAtual.progresso[epAtual.dados.id] = {tempo, porcentagem};
        localStorage.setItem('progresso_felipe', JSON.stringify(perfilAtual.progresso));
    }
}

function restaurarProgresso() {
    setTimeout(() => {
        const v = document.getElementById('video-player');
        if(epAtual.dados.id && perfilAtual.progresso?.[epAtual.dados.id]?.tempo) {
            v.currentTime = perfilAtual.progresso[epAtual.dados.id].tempo;
        }
    }, 1200);
}

function mostrarProximoEp() {
    if(temporizadorProximo) clearInterval(temporizadorProximo);
    const prox = epAtual.indice + 1;
    if(prox >= serieAtual.eps.length) {
        document.getElementById('avisoProximo').innerHTML = `<h4>Fim da temporada</h4><p>Não há mais episódios</p>`;
        document.getElementById('avisoProximo').classList.add('ativo');
        return;
    }
    document.getElementById('avisoProximo').classList.add('ativo');
    let cont = 10;
    document.getElementById('contagemRegressiva').textContent = cont;
    temporizadorProximo = setInterval(() => {
        cont--;
        document.getElementById('contagemRegressiva').textContent = cont;
        if(cont <= 0) { clearInterval(temporizadorProximo); irProximoEp(); }
    }, 1000);
}

function irProximoEp() {
    clearInterval(temporizadorProximo);
    document.getElementById('avisoProximo').classList.remove('ativo');
    reproduzirEp(epAtual.indice + 1);
}

function fecharPlayer() {
    salvarProgresso();
    pararPlayer();
    document.getElementById('player').classList.remove('ativo');
}

// Navegação melhorada para controle remoto
document.addEventListener('keydown', (e) => {
    const playerAtivo = document.getElementById('player').classList.contains('ativo');
    if(playerAtivo) {
        const v = document.getElementById('video-player');
        switch(e.key) {
            case 'ArrowDown': e.preventDefault(); fecharPlayer(); break;
            case 'ArrowLeft': e.preventDefault(); v.currentTime = Math.max(0, v.currentTime - 10); break;
            case 'ArrowRight': e.preventDefault(); v.currentTime = Math.min(v.duration || 99999, v.currentTime + 10); break;
            case 'Enter': e.preventDefault(); v.paused ? v.play() : v.pause(); break;
            case 'ArrowUp': e.preventDefault(); document.getElementById('controlesVideo').classList.toggle('oculto'); break;
            case 'Escape': e.preventDefault(); fecharPlayer(); break;
        }
        return;
    }

    // Navegação geral entre itens
    const focoAtual = document.activeElement;
    const todosItens = Array.from(document.querySelectorAll('[tabindex="0"]:not([disabled])'))
        .filter(el => el.offsetParent !== null);
    const indiceAtual = todosItens.indexOf(focoAtual);
    if(indiceAtual === -1) return;

    const colunas = window.innerWidth >= 1200 ? 5 : window.innerWidth >= 900 ? 4 : window.innerWidth >= 600 ? 3 : 2;

    switch(e.key) {
        case 'ArrowUp':
            e.preventDefault();
            const acima = indiceAtual - colunas;
            if(acima >= 0) todosItens[acima].focus();
            break;
        case 'ArrowDown':
            e.preventDefault();
            const abaixo = indiceAtual + colunas;
            if(abaixo < todosItens.length) todosItens[abaixo].focus();
            break;
        case 'ArrowLeft':
            e.preventDefault();
            if(indiceAtual % colunas !== 0) todosItens[indiceAtual - 1].focus();
            break;
        case 'ArrowRight':
            e.preventDefault();
            if((indiceAtual + 1) % colunas !== 0 && indiceAtual + 1 < todosItens.length) todosItens[indiceAtual + 1].focus();
            break;
        case 'Enter':
            e.preventDefault();
            if(focoAtual.onclick) focoAtual.click();
            break;
        case 'Escape':
            e.preventDefault();
            if(document.getElementById('secaoEpisodios').style.display === 'block') {
                voltarParaSeries();
            }
            break;
    }
});

function formatarTempo(s) {
    const m = Math.floor(s/60);
    const seg = Math.floor(s%60);
    return `${m.toString().padStart(2,'0')}:${seg.toString().padStart(2,'0')}`;
}

document.getElementById('video-player').addEventListener('timeupdate', () => {
    const v = document.getElementById('video-player');
    if(!v.duration || isNaN(v.duration)) return;
    const p = (v.currentTime / v.duration) * 100;
    document.getElementById('barraTempo').style.width = p + "%";
    document.getElementById('tempoAtual').textContent = formatarTempo(v.currentTime);
    document.getElementById('tempoTotal').textContent = formatarTempo(v.duration);
    salvarProgresso();
});

// Inicia o sistema
window.onload = carregarSeries;
</script>
</body>
</html>
